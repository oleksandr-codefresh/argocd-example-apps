apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https://raw.githubusercontent.com/argoproj-labs/argocd-monorepo-controller/refs/heads/main/manifests/install.yaml

patchesJson6902:
- target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRoleBinding
    name: argocd-monorepo-controller
  patch: |-
    - op: replace
      path: /subjects/0/namespace
      value: rt-fork

transformers:
- |
  apiVersion: builtin
  kind: PatchTransformer
  metadata:
    name: remove-network-policies
  patches:
  - patch: |-
      $patch: delete
    target:
      name: "mrc-argo.*"
      kind: "NetworkPolicy"