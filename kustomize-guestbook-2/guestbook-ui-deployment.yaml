apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - image: xeonalex/guesbook-unprivileged
        name: guestbook-ui
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
