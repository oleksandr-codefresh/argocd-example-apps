kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namePrefix: staging-

commonLabels:
  variant: staging

bases:
- ../../base

patchesStrategicMerge:
- config-map.yaml

patches:
  - target:
      kind: Deployment
      name: the-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: docker.io/xeonalex/guesbook
    newTag: "v0.3.0"
  - name: docker.io/xeonalex/guesbook-unprivileged
    newTag: "v0.3.0"
